<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caro (Gomoku) — Demo</title>
  <style>
    :root { --cell: 30px; --line: #c9b27a; }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      margin: 0; padding: 24px;
      background: #f5f5f7; color: #1d1d1f;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    h1 { margin: 0; font-size: 22px; }
    .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 8px; padding: 9px 16px; font-size: 14px;
      background: #0071e3; color: #fff; cursor: pointer;
    }
    button:disabled { background: #b0b0b5; cursor: default; }
    .status { font-size: 15px; min-height: 22px; }
    .status b { color: #0071e3; }
    .win { color: #1a7f37; font-weight: 700; }
    .board {
      display: grid;
      grid-template-columns: repeat(15, var(--cell));
      grid-template-rows: repeat(15, var(--cell));
      background: #e9d8a6; padding: 6px; border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .cell {
      width: var(--cell); height: var(--cell);
      border: 0.5px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px; cursor: pointer; user-select: none;
      background: transparent;
    }
    .cell:hover:not(.taken) { background: rgba(0,113,227,.12); }
    .cell.X { color: #d12f2f; }
    .cell.O { color: #1f6feb; }
    .cell.taken { cursor: default; }
    .hint { color: #6e6e73; font-size: 13px; max-width: 480px; text-align: center; }
  </style>
</head>
<body>
  <h1>🎯 Caro / Gomoku — 5 ô liên tiếp thắng</h1>
  <div class="bar">
    <button id="newBtn">Tạo ván mới</button>
    <span class="status" id="status">Bấm “Tạo ván mới” để bắt đầu.</span>
  </div>
  <div class="board" id="board"></div>
  <p class="hint">Hai người chơi luân phiên trên cùng máy. Quân đỏ <b>X</b> đi trước,
     quân xanh <b>O</b> đi sau. Mỗi nước gọi API <code>POST /api/games/{id}/moves</code>.</p>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const newBtn = document.getElementById('newBtn');

    let gameId = null;
    let current = 'X';
    let finished = false;

    // Dựng lưới 15x15.
    const cells = [];
    for (let r = 0; r < 15; r++) {
      for (let c = 0; c < 15; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.addEventListener('click', () => onCellClick(r, c, cell));
        boardEl.appendChild(cell);
        cells.push(cell);
      }
    }

    function resetBoard() {
      for (const cell of cells) {
        cell.textContent = '';
        cell.classList.remove('X', 'O', 'taken');
      }
    }

    function setStatus(html) { statusEl.innerHTML = html; }

    newBtn.addEventListener('click', createGame);

    async function createGame() {
      resetBoard();
      finished = false;
      const res = await fetch('/api/games', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerX: 'Người chơi X', playerO: 'Người chơi O' })
      });
      const game = await res.json();
      gameId = game.id;
      current = game.currentPlayer;
      setStatus(`Ván <b>${gameId.slice(0, 8)}</b> — tới lượt <b>${current}</b>`);
    }

    async function onCellClick(row, col, cell) {
      if (!gameId) { setStatus('Hãy tạo ván mới trước.'); return; }
      if (finished || cell.classList.contains('taken')) return;

      const symbol = current;
      const res = await fetch(`/api/games/${gameId}/moves`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row, col, symbol })
      });

      // Controller nuốt lỗi -> có thể trả 200 rỗng; phòng thủ ở client.
      let game = null;
      try { game = await res.json(); } catch { game = null; }
      if (!res.ok || !game) { setStatus('Nước đi không hợp lệ.'); return; }

      // Đặt quân lên bàn (client tự giữ trạng thái bàn cờ).
      cell.textContent = symbol;
      cell.classList.add(symbol, 'taken');

      if (game.status === 1 /* Won */) {
        finished = true;
        setStatus(`<span class="win">🏆 ${game.winner} THẮNG!</span> Bấm “Tạo ván mới” để chơi lại.`);
        return;
      }
      current = game.currentPlayer;
      setStatus(`Ván <b>${gameId.slice(0, 8)}</b> — tới lượt <b>${current}</b>`);
    }
  </script>
</body>
</html>
