name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/CaroGame.Tests/CaroGame.Tests.csproj

      - name: Build (Release)
        run: dotnet build tests/CaroGame.Tests/CaroGame.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/CaroGame.Tests/CaroGame.Tests.csproj -c Release --no-build --verbosity normal

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet format (check only)
        run: dotnet format src/CaroGame.Api/CaroGame.Api.csproj --verify-no-changes --severity warn
        continue-on-error: true
